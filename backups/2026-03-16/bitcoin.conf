# Optimization for your 1TB SSD
dbcache=12288
txindex=1
server=1

# Network/RPC
rpcuser=nodeadmin
rpcpassword=nodeadmin
[main]
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# RPC Performance (Fixes the Timeout errors)
rpcworkqueue=128
rpcthreads=16

# Networking (Allows Docker to talk to Bitcoin)
rpcallowip=172.17.0.0/16
rpcallowip=172.18.0.0/16

# Tor NAT Traversal & Privacy
proxy=127.0.0.1:9050
listen=1
bind=127.0.0.1
debug=tor

# Enable both IPv4 (Outbound) and Tor (Inbound/Outbound)
# This keeps your current 9-10 peers while adding Onion connectivity.
discover=1
onion=127.0.0.1:9050
